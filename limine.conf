timeout: 0

/ME OS
    protocol: limine
    path: boot():/boot/kernel.elf
    # A program, carried on the disc as its own file rather than built into the
    # kernel. The kernel copies it into the filesystem at first boot so that
    # RUN HELLO reads it the same way it reads anything else. Added at M33: the
    # whole point of that milestone is that the program is not part of ME OS.
    module_path: boot():/boot/bin/hello
    module_path: boot():/boot/bin/paint
    module_path: boot():/boot/bin/draw
    module_path: boot():/boot/bin/spin
    module_path: boot():/boot/bin/pong
    module_path: boot():/boot/bin/snake
    module_path: boot():/boot/bin/tetris
    module_path: boot():/boot/bin/invaders
    module_path: boot():/boot/bin/breakout
    module_path: boot():/boot/bin/mines
